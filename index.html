  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--wine:#8a1e3d;--wine-dark:#6b152c;--pink:#f63b79;--ink:#2a0f12;--muted:#8b646b;--line:rgba(42,15,24,.1)}
    html{scroll-behavior:smooth}
    body{min-height:100vh;overflow-x:hidden;background:linear-gradient(180deg,#fff 0%,#fcf8f9 100%);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
    .bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 15% 0%,rgba(254,219,225,.65),transparent 50%),radial-gradient(ellipse at 85% 100%,rgba(246,59,96,.08),transparent 45%)}
    .wrap{width:min(1100px,100% - 40px);margin:auto;padding:24px 0 52px;display:grid;gap:28px}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
    .brand{display:flex;align-items:center;gap:14px;font:700 28px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.8px}
    .brand span{color:var(--wine)}
    .logo{width:54px;height:54px;border-radius:18px;object-fit:cover;box-shadow:0 8px 22px rgba(138,30,61,.25)}
    .menu-button,.close-button{border:1px solid var(--line);background:#fff;color:var(--ink);width:50px;height:50px;border-radius:16px;font-size:19px;cursor:pointer}
    .card{position:relative;overflow:hidden;padding:38px 34px;border:1px solid #fff;border-radius:28px;background:rgba(255,255,255,.9);box-shadow:0 8px 32px -12px rgba(42,15,20,.12);backdrop-filter:blur(16px)}
    .card:before,.download-frame:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--wine),var(--pink),var(--wine))}
    .eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--wine);font-size:11px;font-weight:800;letter-spacing:4px;text-transform:uppercase}
    .eyebrow:before{content:"";width:26px;height:2px;background:var(--wine)}
    h1,h2{font-family:'Space Grotesk',sans-serif}
    h1{max-width:720px;margin-bottom:12px;font-size:clamp(46px,7.5vw,80px);line-height:1.02;letter-spacing:-2.5px}
    h1 span{color:var(--wine)}
    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:16px;margin-top:34px}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:13px;min-width:250px;padding:20px 34px;border:0;border-radius:60px;background:linear-gradient(135deg,var(--wine),#a82e65);color:#fff;font:700 17px 'Plus Jakarta Sans',sans-serif;text-decoration:none;box-shadow:0 12px 32px -8px rgba(138,30,61,.38);transition:transform .2s,box-shadow .2s}
    .button:hover{transform:translateY(-3px);box-shadow:0 18px 38px -8px rgba(138,30,61,.42)}
    .button.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 4px 16px -6px rgba(42,15,20,.1)}
    .button.secondary i{color:var(--wine)}
    .section-title{display:flex;align-items:center;gap:16px;margin-bottom:24px;font-size:32px;letter-spacing:-1px}
    .section-title:after{content:"";height:2px;flex:1;background:linear-gradient(90deg,var(--wine),#fa6086,transparent);opacity:.45}
    .games{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .game{display:flex;align-items:center;gap:14px;padding:19px 16px;border:1px solid var(--line);border-radius:20px;background:#f8fafc;transition:.2s}
    .game:hover{transform:translateY(-3px);border-color:var(--wine);background:#fff}
    .game-icon{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--wine),#a82e65);color:#fff;font-size:19px}
    .game-name{font-weight:800;font-size:15px}.game-label{margin-top:4px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
    .download{display:flex;justify-content:center}
    .download-frame{position:relative;width:min(560px,100%);padding:26px;border:1px solid #fff;border-radius:26px;background:rgba(255,255,255,.9);box-shadow:0 8px 32px -12px rgba(42,15,20,.12)}
    .download-frame .button{width:100%;text-transform:uppercase;letter-spacing:1.2px}
    footer{text-align:center;padding-top:4px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
    .overlay{position:fixed;inset:0;z-index:5;background:rgba(42,15,21,.4);opacity:0;pointer-events:none;transition:opacity .25s}
    .overlay.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;z-index:6;width:min(320px,85vw);height:100%;padding:28px;background:#fff;box-shadow:-20px 0 60px rgba(42,15,21,.15);transform:translateX(110%);transition:transform .3s}
    .drawer.open{transform:translateX(0)}.close-button{margin-bottom:28px;color:var(--wine)}
    .drawer nav{display:grid}.drawer a{padding:16px 10px;border-bottom:1px solid var(--line);color:var(--ink);font-weight:700;text-decoration:none}.drawer a i{width:26px;color:var(--wine)}
    @media(max-width:767px){.games{grid-template-columns:repeat(2,1fr)}.card{padding:30px 24px}.section-title{font-size:27px}}
    @media(max-width:430px){.wrap{width:calc(100% - 28px);gap:20px;padding-top:16px}.brand{font-size:23px}.logo{width:48px;height:48px;border-radius:15px}.hero{padding:28px 20px}h1{font-size:36px;letter-spacing:-1.5px}.actions{flex-direction:column;align-items:stretch}.button{width:100%;min-width:0;padding:18px 20px;font-size:15px}.games{gap:9px}.game{gap:10px;padding:13px 10px}.game-icon{width:38px;height:38px;border-radius:12px;font-size:15px}.game-name{font-size:13px}.game-label{font-size:9px}.section-title{font-size:23px}.download-frame{padding:20px 16px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="Main menu">
    <button class="close-button" id="closeMenu" aria-label="Close menu"><i class="fas fa-times"></i></button>
    <nav><a href="#top"><i class="fas fa-house"></i>Home</a><a href="#games"><i class="fas fa-table"></i>Games</a><a href="#download"><i class="fas fa-download"></i>Download</a></nav>
  </aside>
  <main class="wrap" id="top">
    <header class="navbar">
      <div class="brand"><img class="logo" src="https://574a81a0-e9bd-4d73-9f02-3df87e218631.lovableproject.com/__l5e/assets-v1/0919920d-72ad-4eb1-8145-6366a1d12180/desi-mtk-logo.png" alt="DMT App logo"> <div>DMT <span>App</span></div></div>
      <button class="menu-button" id="openMenu" aria-label="Open menu"><i class="fas fa-bars"></i></button>
    </header>
    <section class="card hero">
      <div class="eyebrow">Premium Play</div>
      <h1>DMT <span>App</span></h1>
      <div class="actions">
        <a class="button" href="https://dsmt-app.vercel.app/app.apk" download><i class="fas fa-download"></i>Download APK</a>
        <a class="button secondary" href="#games"><i class="fas fa-gem"></i>Explore Games</a>
      </div>
    </section>
    <section class="card" id="games">
      <h2 class="section-title">Games</h2>
      <div class="games">
        <article class="game"><div class="game-icon"><i class="fas fa-dice-one"></i></div><div><div class="game-name">Haruf</div><div class="game-label">Ander Haruf</div></div></article>
        <article class="game"><div class="game-icon"><i class="fas fa-link"></i></div><div><div class="game-name">Haruf</div><div class="game-label">Bahar Haruf</div></div></article>
        <article class="game"><div class="game-icon"><i class="fas fa-layer-group"></i></div><div><div class="game-name">Joodi Digit</div><div class="game-label">Jodi title</div></div></article>
      </div>
    </section>
    <section class="download" id="download"><div class="download-frame"><a class="button" href="https://dsmt-app.vercel.app/app.apk" download><i class="fas fa-download"></i>Download Now</a></div></section>
    <footer>DMT App · Entertainment Platform</footer>
  </main>
  <script>
    const drawer=document.getElementById('drawer');
    const overlay=document.getElementById('overlay');
    function closeMenu(){drawer.classList.remove('open');overlay.classList.remove('open')}
    document.getElementById('openMenu').addEventListener('click',()=>{drawer.classList.add('open');overlay.classList.add('open')});
    document.getElementById('closeMenu').addEventListener('click',closeMenu);
    overlay.addEventListener('click',closeMenu);
    drawer.querySelectorAll('a').forEach(link=>link.addEventListener('click',closeMenu));
  </script>
</body>
</html>

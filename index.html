  <script>
    const drawer=document.getElementById('drawer');
    const overlay=document.getElementById('overlay');
    const menuButton=document.getElementById('openMenu');
    function closeMenu(){drawer.classList.remove('open');overlay.classList.remove('open');drawer.setAttribute('aria-hidden','true');menuButton.setAttribute('aria-expanded','false')}
    menuButton.addEventListener('click',()=>{drawer.classList.add('open');overlay.classList.add('open');drawer.setAttribute('aria-hidden','false');menuButton.setAttribute('aria-expanded','true')});
    document.getElementById('closeMenu').addEventListener('click',closeMenu);
    overlay.addEventListener('click',closeMenu);
    drawer.querySelectorAll('a').forEach(link=>link.addEventListener('click',closeMenu));
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu()});
